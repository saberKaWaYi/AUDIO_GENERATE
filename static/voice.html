<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="voice.title">人物音色制作 - AI AUDIO</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/i18n.js"></script>
</head>
<body class="app-body">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <a class="logo" href="/index.html" aria-label="AI AUDIO 首页">
        <svg class="logo-mark" viewBox="0 0 44 44" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#818cf8"/>
              <stop offset="55%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="40" height="40" rx="12" fill="url(#logoGrad)"/>
          <rect x="6.5" y="6.5" width="31" height="31" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
          <g fill="#ffffff">
            <rect x="12" y="18" width="3.4" height="8" rx="1.7"/>
            <rect x="17.3" y="13" width="3.4" height="18" rx="1.7"/>
            <rect x="22.6" y="16" width="3.4" height="12" rx="1.7"/>
            <rect x="27.9" y="19" width="3.4" height="6" rx="1.7"/>
          </g>
        </svg>
        <span class="logo-text">AI AUDIO</span>
      </a>
      <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="收起或展开侧栏" title="收起或展开">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="/voice.html">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 3a3 3 0 0 0-3 3v4a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 9v1a5 5 0 0 0 10 0V9M10 15v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></span>
        <span class="nav-label" data-i18n="nav.voice">人物音色制作</span>
      </a>
      <a class="nav-item" href="/index.html">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 8v4M8 5v10M12 7v6M16 9v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></span>
        <span class="nav-label" data-i18n="nav.asrm">ASMR 制作</span>
      </a>
      <div class="nav-item disabled">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10 6.5v7M8 8h3.2a1.4 1.4 0 0 1 0 2.8H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></span>
        <span class="nav-label" data-i18n="nav.credits">购买积分</span>
        <span class="nav-tag" data-i18n="nav.soon">即将上线</span>
      </div>
      <div class="nav-item disabled">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="2.5" y="5" width="15" height="10" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M2.5 8.5h15" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></span>
        <span class="nav-label" data-i18n="nav.payment">支付</span>
        <span class="nav-tag" data-i18n="nav.soon">即将上线</span>
      </div>
      <div class="nav-item disabled">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 2.8l2.2 4.5 5 .7-3.6 3.5.85 5L10 14l-4.45 2.5.85-5L2.8 8l5-.7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/></svg></span>
        <span class="nav-label" data-i18n="nav.points">积分</span>
        <span class="nav-tag" data-i18n="nav.soon">即将上线</span>
      </div>
    </nav>
    <div class="sidebar-foot">
      <span id="sidebarUserName" class="sidebar-user"></span>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <div class="topbar-title" data-i18n="nav.voice">人物音色制作</div>
      <div class="user-area">
        <div id="langSwitcher" class="lang-switcher"></div>
        <img id="avatar" class="avatar" alt="" hidden>
        <span id="userName"></span>
        <button id="logoutBtn" data-i18n="topbar.logout">退出登录</button>
      </div>
    </header>

    <main class="main voice-main">
      <section class="voice-intro">
        <div class="voice-kicker">VOICE STUDIO</div>
        <h1 data-i18n="voice.heroTitle">把一段声音，变成专属音色</h1>
        <p data-i18n="voice.heroDesc">上传参考音频与一张封面照片，系统会提取人声克隆出可反复使用的音色。参考音频总时长需在 30 到 90 秒之间。</p>
      </section>

      <div class="voice-columns">
        <section class="voice-panel">
          <div class="voice-step"><span class="voice-step-num">01</span><h3 data-i18n="voice.stepOne">音色信息</h3></div>
          <div class="form-field">
            <label for="voiceName" data-i18n="voice.nameLabel">音色名称</label>
            <input id="voiceName" type="text" data-i18n-ph="voice.namePh" placeholder="例如：晚安耳语">
          </div>
          <div class="form-field">
            <label for="voiceDesc" data-i18n="voice.descLabel">音色描述（可选）</label>
            <input id="voiceDesc" type="text" data-i18n-ph="voice.descPh" placeholder="简单描述它的特点">
          </div>
          <div class="form-field">
            <label data-i18n="voice.coverLabel">封面照片（可选）</label>
            <label class="voice-cover" for="voiceCover" id="voiceCoverDrop">
              <img id="coverPreview" alt="" hidden>
              <svg id="coverIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>
              <input id="voiceCover" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
            </label>
          </div>

          <div class="voice-step"><span class="voice-step-num">02</span><h3 data-i18n="voice.stepTwo">参考音频</h3></div>
          <label class="voice-dropzone" id="voiceDropzone" for="voiceFiles">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
            <strong data-i18n="voice.dropTitle">拖入 MP3，或点击选择</strong>
            <span data-i18n="voice.dropHint">可多选 · 总时长需在 30~90 秒之间</span>
            <input id="voiceFiles" type="file" accept="audio/mpeg,.mp3" multiple>
          </label>

          <p id="fileCount" class="voice-fcount"></p>
          <ul id="fileList" class="voice-flist"></ul>

          <div class="voice-meter">
            <div class="voice-meter-head">
              <span data-i18n="voice.totalLabel">总时长</span>
              <div><strong id="totalDuration">0.00</strong> <em data-i18n="voice.secUnit">秒</em></div>
            </div>
            <div class="voice-track"><div class="voice-zone"></div><div class="voice-pointer" id="voicePointer"></div></div>
            <div class="voice-scale"><span>30s</span><span data-i18n="voice.scaleMid">合格区间</span><span>90s</span></div>
          </div>

          <p id="voiceMsg" class="msg"></p>
          <button id="createBtn" class="voice-create" type="button" disabled data-i18n="voice.createBtn">创建音色</button>
        </section>

        <section class="voice-panel">
          <div class="voice-lib-head"><h3 data-i18n="voice.library">我的音色</h3></div>
          <div id="voiceLibrary"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
  <script>
    const MIN_SECONDS = 30;
    const MAX_SECONDS = 90;
    const TRACK_MAX = 120;
    const AUDIO_SUFFIXES = [".mp3"];
    const IMAGE_SUFFIXES = [".jpg", ".jpeg", ".png"];

    function hasSuffix(file, suffixes) {
      const name = file.name.toLowerCase();
      return suffixes.some((suffix) => name.endsWith(suffix));
    }

    const nameInput = document.getElementById("voiceName");
    const descInput = document.getElementById("voiceDesc");
    const coverInput = document.getElementById("voiceCover");
    const coverPreview = document.getElementById("coverPreview");
    const coverIcon = document.getElementById("coverIcon");
    const fileInput = document.getElementById("voiceFiles");
    const dropzone = document.getElementById("voiceDropzone");
    const fileCountEl = document.getElementById("fileCount");
    const fileList = document.getElementById("fileList");
    const totalDurationEl = document.getElementById("totalDuration");
    const pointer = document.getElementById("voicePointer");
    const voiceMsg = document.getElementById("voiceMsg");
    const createBtn = document.getElementById("createBtn");
    const libraryEl = document.getElementById("voiceLibrary");

    let durationEntries = [];
    let rejectedAudioCount = 0;
    let coverFile = null;
    let coverObjectUrl = null;
    let messageRenderer = null;
    let resultMessage = null;
    let libraryRenderer = null;
    let voices = [];

    function t(key, vars) {
      return I18n.t(key, vars);
    }

    function renderMessage() {
      if (resultMessage) {
        resultMessage();
      } else if (messageRenderer) {
        messageRenderer();
      }
    }

    function showMessage(key, isError, vars) {
      messageRenderer = () => {
        voiceMsg.textContent = t(key, vars);
        voiceMsg.classList.toggle("error", Boolean(isError));
        voiceMsg.classList.toggle("ok", !isError);
      };
      renderMessage();
    }

    function showResultMessage(key, isError, vars) {
      resultMessage = () => {
        voiceMsg.textContent = t(key, vars);
        voiceMsg.classList.toggle("error", Boolean(isError));
        voiceMsg.classList.toggle("ok", !isError);
      };
      renderMessage();
    }

    function clearMessage() {
      resultMessage = null;
      messageRenderer = null;
      voiceMsg.textContent = "";
      voiceMsg.classList.remove("error", "ok");
    }

    function renderAnswer() {
      fileCountEl.textContent = durationEntries.length ? t("voice.fileCount", { n: durationEntries.length }) : t("voice.noFiles");
      fileList.textContent = "";
      let total = 0;
      let readFailed = false;

      for (const entry of durationEntries) {
        const item = document.createElement("li");
        item.className = "voice-file-item" + (entry.seconds === null ? " invalid" : "");
        const name = document.createElement("span");
        name.className = "voice-file-name";
        name.textContent = entry.name;
        const seconds = document.createElement("span");
        seconds.className = "voice-file-duration";
        if (entry.seconds === null) {
          seconds.textContent = "—";
          readFailed = true;
        } else {
          total += entry.seconds;
          seconds.textContent = entry.seconds.toFixed(2) + " " + t("voice.secUnit");
        }
        item.appendChild(name);
        item.appendChild(seconds);
        fileList.appendChild(item);
      }

      totalDurationEl.textContent = total.toFixed(2);
      pointer.style.left = Math.min(total / TRACK_MAX, 1) * 100 + "%";

      let valid = false;
      if (rejectedAudioCount > 0) {
        showMessage("voice.videoTypeRejected", true, { n: rejectedAudioCount });
      } else if (durationEntries.length === 0) {
        clearMessage();
      } else if (readFailed) {
        showMessage("voice.readFailed", true);
      } else if (total < MIN_SECONDS) {
        showMessage("voice.tooShort", true);
      } else if (total > MAX_SECONDS) {
        showMessage("voice.tooLong", true);
      } else {
        showMessage("voice.valid", false);
        valid = true;
      }
      createBtn.disabled = !valid;
    }

    function readAudioDuration(file) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const audio = document.createElement("audio");
        audio.preload = "metadata";
        audio.onloadedmetadata = () => {
          const duration = audio.duration;
          URL.revokeObjectURL(url);
          if (!Number.isFinite(duration) || duration <= 0) {
            resolve(null);
            return;
          }
          resolve(duration);
        };
        audio.onerror = () => {
          URL.revokeObjectURL(url);
          resolve(null);
        };
        audio.src = url;
      });
    }

    async function processFiles(files) {
      resultMessage = null;
      const accepted = files.filter((file) => hasSuffix(file, AUDIO_SUFFIXES));
      rejectedAudioCount = files.length - accepted.length;
      durationEntries = accepted.map((file) => ({ name: file.name, seconds: null, file: file }));
      renderAnswer();
      for (let i = 0; i < accepted.length; i += 1) {
        durationEntries[i].seconds = await readAudioDuration(accepted[i]);
        renderAnswer();
      }
    }

    function clearCover() {
      if (coverObjectUrl) {
        URL.revokeObjectURL(coverObjectUrl);
        coverObjectUrl = null;
      }
      coverFile = null;
      coverPreview.hidden = true;
      coverIcon.hidden = false;
    }

    function setCover(file) {
      resultMessage = null;
      if (!file) {
        clearCover();
        return false;
      }
      if (!hasSuffix(file, IMAGE_SUFFIXES)) {
        clearCover();
        showMessage("voice.coverTypeRejected", true);
        return false;
      }
      clearCover();
      coverFile = file;
      coverObjectUrl = URL.createObjectURL(file);
      coverPreview.src = coverObjectUrl;
      coverPreview.hidden = false;
      coverIcon.hidden = true;
      return true;
    }

    function onCoverChanged(event) {
      setCover(event.target.files[0]);
    }

    function renderLibrary() {
      libraryEl.textContent = "";
      if (libraryRenderer) {
        libraryRenderer();
        return;
      }
      const note = document.createElement("p");
      note.className = "voice-library-note";
      note.textContent = t("voice.loading");
      libraryEl.appendChild(note);
    }

    async function loadLibrary() {
      try {
        const res = await fetch("/api/audio/characters?page=1&page_size=50", { credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || t("voice.loadFailed"));
        }
        voices = data.items;
        libraryRenderer = () => {
          libraryEl.textContent = "";
          if (voices.length === 0) {
            const note = document.createElement("p");
            note.className = "voice-library-note";
            note.textContent = t("voice.libraryEmpty");
            libraryEl.appendChild(note);
            return;
          }
          for (const item of voices) {
            const card = document.createElement("article");
            card.className = "voice-item";
            const cover = document.createElement("div");
            cover.className = "voice-item-cover";
            if (item.cover_image) {
              const img = document.createElement("img");
              img.src = item.cover_image;
              img.alt = "";
              cover.appendChild(img);
            } else {
              const mark = document.createElement("span");
              mark.textContent = item.title.slice(0, 1);
              cover.appendChild(mark);
            }
            const body = document.createElement("div");
            body.className = "voice-item-body";
            const title = document.createElement("div");
            title.className = "voice-item-title";
            title.textContent = item.title;
            const meta = document.createElement("div");
            meta.className = "voice-item-meta";
            meta.textContent = item.state + " · " + t(item.visibility === "public" ? "voice.public" : "voice.private");
            const ref = document.createElement("div");
            ref.className = "voice-item-ref";
            ref.textContent = item.reference_id;
            body.appendChild(title);
            body.appendChild(meta);
            body.appendChild(ref);
            card.appendChild(cover);
            card.appendChild(body);
            libraryEl.appendChild(card);
          }
        };
        renderLibrary();
      } catch (error) {
        voices = [];
        libraryRenderer = () => {
          libraryEl.textContent = "";
          const note = document.createElement("p");
          note.className = "voice-library-note";
          note.textContent = t("voice.loadFailed") + " " + error.message;
          libraryEl.appendChild(note);
        };
        renderLibrary();
      }
    }

    async function submitCreate() {
      resultMessage = null;
      const title = nameInput.value.trim();
      if (!title) {
        showMessage("voice.reqName", true);
        return;
      }
      if (durationEntries.length === 0) {
        showMessage("voice.reqFiles", true);
        return;
      }

      let total = 0;
      for (const entry of durationEntries) {
        if (entry.seconds === null || !Number.isFinite(entry.seconds)) {
          showMessage("voice.readFailed", true);
          return;
        }
        total += entry.seconds;
      }
      if (total < MIN_SECONDS) {
        showMessage("voice.tooShort", true);
        return;
      }
      if (total > MAX_SECONDS) {
        showMessage("voice.tooLong", true);
        return;
      }

      const form = new FormData();
      form.append("title", title);
      form.append("duration_seconds", String(total));
      const description = descInput.value.trim();
      if (description) {
        form.append("description", description);
      }
      for (const entry of durationEntries) {
        form.append("voices", entry.file, entry.file.name);
      }
      if (coverFile) {
        form.append("cover_image", coverFile, coverFile.name);
      }

      createBtn.disabled = true;
      createBtn.textContent = t("voice.creating");
      try {
        const res = await fetch("/api/audio/characters/create", {
          method: "POST",
          credentials: "same-origin",
          body: form,
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || String(res.status));
        }
        showResultMessage("voice.createSuccess", false, { id: data.reference_id });
        await loadLibrary();
      } catch (error) {
        showResultMessage("voice.createFailed", true, { msg: error.message });
      } finally {
        createBtn.textContent = t("voice.createBtn");
        renderAnswer();
      }
    }

    fileInput.addEventListener("change", (event) => {
      processFiles(Array.from(event.target.files));
    });
    coverInput.addEventListener("change", onCoverChanged);

    dropzone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropzone.classList.add("dragging");
    });
    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragging");
    });
    dropzone.addEventListener("drop", (event) => {
      event.preventDefault();
      dropzone.classList.remove("dragging");
      processFiles(Array.from(event.dataTransfer.files));
    });

    const coverDrop = document.getElementById("voiceCoverDrop");
    coverDrop.addEventListener("dragover", (event) => {
      event.preventDefault();
      coverDrop.classList.add("dragging");
    });
    coverDrop.addEventListener("dragleave", () => {
      coverDrop.classList.remove("dragging");
    });
    coverDrop.addEventListener("drop", (event) => {
      event.preventDefault();
      coverDrop.classList.remove("dragging");
      setCover(event.dataTransfer.files[0]);
    });

    createBtn.addEventListener("click", submitCreate);

    window.addEventListener("aiaudio:langchange", () => {
      renderAnswer();
      renderLibrary();
    });

    async function initPage() {
      I18n.init();
      I18n.buildSwitcher(document.getElementById("langSwitcher"));
      const ok = await App.init();
      if (!ok) {
        return;
      }
      renderAnswer();
      renderLibrary();
      await loadLibrary();
    }

    window.addEventListener("load", initPage);
  </script>
</body>
</html>
