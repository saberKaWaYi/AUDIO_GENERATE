<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASMR 制作 - AI AUDIO</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="app-body">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-head">
      <a class="logo" href="/index.html" aria-label="AI AUDIO 首页">
        <svg class="logo-mark" viewBox="0 0 44 44" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#818cf8"/>
              <stop offset="55%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="40" height="40" rx="12" fill="url(#logoGrad)"/>
          <rect x="6.5" y="6.5" width="31" height="31" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
          <g fill="#ffffff">
            <rect x="12" y="18" width="3.4" height="8" rx="1.7"/>
            <rect x="17.3" y="13" width="3.4" height="18" rx="1.7"/>
            <rect x="22.6" y="16" width="3.4" height="12" rx="1.7"/>
            <rect x="27.9" y="19" width="3.4" height="6" rx="1.7"/>
          </g>
        </svg>
        <span class="logo-text">AI AUDIO</span>
      </a>
      <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="收起或展开侧栏" title="收起或展开">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item active" href="/index.html">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 8v4M8 5v10M12 7v6M16 9v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></span>
        <span class="nav-label">ASMR 制作</span>
      </a>
      <div class="nav-item disabled">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10 6.5v7M8 8h3.2a1.4 1.4 0 0 1 0 2.8H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg></span>
        <span class="nav-label">购买积分</span>
        <span class="nav-tag">即将上线</span>
      </div>
      <div class="nav-item disabled">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><rect x="2.5" y="5" width="15" height="10" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M2.5 8.5h15" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></span>
        <span class="nav-label">支付</span>
        <span class="nav-tag">即将上线</span>
      </div>
      <div class="nav-item disabled">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M10 2.8l2.2 4.5 5 .7-3.6 3.5.85 5L10 14l-4.45 2.5.85-5L2.8 8l5-.7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/></svg></span>
        <span class="nav-label">积分</span>
        <span class="nav-tag">即将上线</span>
      </div>
    </nav>
    <div class="sidebar-foot">
      <span id="sidebarUserName" class="sidebar-user"></span>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <div class="topbar-title">ASMR 制作</div>
      <div class="user-area">
        <img id="avatar" class="avatar" alt="" hidden>
        <span id="userName"></span>
        <button id="logoutBtn">退出登录</button>
      </div>
    </header>

    <main class="main">
      <section class="hero">
        <div class="hero-content">
          <span class="hero-kicker">AI AUDIO STUDIO</span>
          <h1>让想象，成为可听见的声音</h1>
          <p>挑选声线角色，写下你的灵感，AI 为你生成专属 ASMR 音频作品。从一段文字，到沉浸式声境。</p>
          <div class="hero-features">
            <span class="hero-feature">多角色声线</span>
            <span class="hero-feature">四种语言</span>
            <span class="hero-feature">高清音质输出</span>
          </div>
        </div>
        <div class="hero-art" aria-hidden="true">
          <svg viewBox="0 0 160 160">
            <defs>
              <linearGradient id="heroRing" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
              </linearGradient>
            </defs>
            <circle cx="80" cy="80" r="58" fill="none" stroke="url(#heroRing)" stroke-width="1.5" opacity="0.5"/>
            <circle cx="80" cy="80" r="44" fill="none" stroke="url(#heroRing)" stroke-width="1.5" opacity="0.7"/>
            <circle cx="80" cy="80" r="30" fill="#ffffff" fill-opacity="0.1" stroke="url(#heroRing)" stroke-width="1.5"/>
            <g fill="#ffffff">
              <rect x="70" y="66" width="4" height="28" rx="2"/>
              <rect x="78" y="58" width="4" height="44" rx="2"/>
              <rect x="86" y="64" width="4" height="32" rx="2"/>
            </g>
          </svg>
        </div>
      </section>

      <div class="page-head">
        <h2>创作配置</h2>
        <p class="hint">填写作品信息，选择合适角色，提交后可在下方查询进度。</p>
      </div>

      <form id="taskForm" class="task-form" novalidate>
        <div class="form-field">
          <label for="title">作品标题</label>
          <input id="title" type="text" placeholder="例如：雨夜治愈轻声" required>
        </div>

        <div class="form-field">
          <span class="field-label">参与角色</span>
          <div id="characterList" class="character-list">
            <span class="hint">正在加载角色...</span>
          </div>
        </div>

        <div class="form-field">
          <label for="theme">创作主题</label>
          <textarea id="theme" rows="5" placeholder="详细的创作主题与情节描述" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="duration">目标时长（分钟）</label>
            <input id="duration" type="number" min="1" step="1" value="5" required>
          </div>
          <div class="form-field">
            <label for="language">语言</label>
            <select id="language" required>
              <option value="zh">中文 zh</option>
              <option value="ja">日语 ja</option>
              <option value="en">英语 en</option>
              <option value="ko">韩语 ko</option>
            </select>
          </div>
        </div>

        <div class="form-foot">
          <span class="type-badge">任务类型：ASMR_TEXT</span>
          <button id="submitBtn" class="primary-btn" type="submit">下发任务</button>
        </div>
      </form>

      <p id="formMsg" class="msg"></p>

      <section id="resultPanel" class="result-panel" hidden>
        <h3>任务已创建</h3>
        <p class="result-line">任务 ID：<code id="resultTaskId"></code></p>
        <p class="result-line">当前状态：<span id="resultStatus" class="status-tag"></span></p>
        <button id="queryBtn" class="secondary-btn" type="button">查询任务状态</button>
        <div id="queryResult" class="query-result"></div>
      </section>
    </main>
  </div>

  <script src="/app.js"></script>
  <script>
    const form = document.getElementById("taskForm");
    const titleInput = document.getElementById("title");
    const themeInput = document.getElementById("theme");
    const durationInput = document.getElementById("duration");
    const languageInput = document.getElementById("language");
    const characterList = document.getElementById("characterList");
    const submitBtn = document.getElementById("submitBtn");
    const formMsg = document.getElementById("formMsg");
    const resultPanel = document.getElementById("resultPanel");
    const resultTaskId = document.getElementById("resultTaskId");
    const resultStatus = document.getElementById("resultStatus");
    const queryBtn = document.getElementById("queryBtn");
    const queryResult = document.getElementById("queryResult");

    let createdTaskId = null;

    function showMessage(text, isError) {
      formMsg.textContent = text;
      formMsg.classList.toggle("error", Boolean(isError));
    }

    async function loadCharacters() {
      try {
        const data = await App.api("/api/audio/characters?page=1&page_size=50");
        characterList.textContent = "";
        if (data.items.length === 0) {
          const empty = document.createElement("span");
          empty.className = "hint";
          empty.textContent = "暂无可用角色，请先导入角色。";
          characterList.appendChild(empty);
          return;
        }
        for (const item of data.items) {
          const label = document.createElement("label");
          label.className = "character-option";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = item.reference_id;
          checkbox.className = "character-checkbox";
          const text = document.createElement("span");
          text.textContent = item.title + "（" + item.reference_id + "）";
          label.appendChild(checkbox);
          label.appendChild(text);
          characterList.appendChild(label);
        }
        if (data.total > data.items.length) {
          const more = document.createElement("p");
          more.className = "hint";
          more.textContent = "角色较多，当前只显示前 " + data.items.length + " 个。";
          characterList.appendChild(more);
        }
      } catch (e) {
        characterList.textContent = "";
        const empty = document.createElement("span");
        empty.className = "hint";
        empty.textContent = "角色加载失败：" + e.message;
        characterList.appendChild(empty);
      }
    }

    function selectedReferenceIds() {
      const checked = characterList.querySelectorAll(".character-checkbox:checked");
      return Array.from(checked).map((el) => el.value);
    }

    async function submitTask(event) {
      event.preventDefault();
      showMessage("", false);
      const title = titleInput.value.trim();
      const theme = themeInput.value.trim();
      const referenceIds = selectedReferenceIds();
      const duration = Number(durationInput.value);
      const language = languageInput.value;

      if (!title) {
        showMessage("请输入作品标题", true);
        return;
      }
      if (referenceIds.length === 0) {
        showMessage("请至少选择一个角色", true);
        return;
      }
      if (!theme) {
        showMessage("请输入创作主题", true);
        return;
      }
      if (!Number.isInteger(duration) || duration < 1) {
        showMessage("时长必须是大于等于 1 的整数", true);
        return;
      }

      submitBtn.disabled = true;
      try {
        const result = await App.api("/api/audio/tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            type: "ASMR_TEXT",
            title: title,
            reference_ids: referenceIds,
            theme: theme,
            duration_minutes: duration,
            language: language,
          }),
        });
        createdTaskId = result.task_id;
        resultTaskId.textContent = result.task_id;
        resultStatus.textContent = result.status;
        resultStatus.className = "status-tag status-" + result.status;
        queryResult.textContent = "";
        resultPanel.hidden = false;
        showMessage("下发成功", false);
      } catch (e) {
        showMessage("下发失败：" + e.message, true);
      } finally {
        submitBtn.disabled = false;
      }
    }

    function renderSubtasks(subtasks) {
      queryResult.textContent = "";
      for (const sub of subtasks) {
        const card = document.createElement("div");
        card.className = "subtask-card";

        const head = document.createElement("p");
        head.className = "subtask-head";
        const status = document.createElement("span");
        status.className = "status-tag status-" + sub.status;
        status.textContent = sub.status;
        head.appendChild(document.createTextNode(sub.type + " · "));
        head.appendChild(status);
        card.appendChild(head);

        const text = document.createElement("pre");
        text.className = "subtask-text";
        text.textContent = sub.result.result_text;
        card.appendChild(text);

        const tokens = document.createElement("p");
        tokens.className = "hint";
        tokens.textContent = "prompt tokens: " + sub.result.prompt_tokens + " · completion tokens: " + sub.result.completion_tokens;
        card.appendChild(tokens);
        queryResult.appendChild(card);
      }
    }

    async function queryTask() {
      if (!createdTaskId) {
        return;
      }
      queryBtn.disabled = true;
      try {
        const data = await App.api("/api/audio/tasks/" + encodeURIComponent(createdTaskId));
        resultStatus.textContent = data.status;
        resultStatus.className = "status-tag status-" + data.status;
        renderSubtasks(data.subtasks);
      } catch (e) {
        showMessage("查询失败：" + e.message, true);
      } finally {
        queryBtn.disabled = false;
      }
    }

    async function initPage() {
      const ok = await App.init();
      if (!ok) {
        return;
      }
      form.addEventListener("submit", submitTask);
      queryBtn.addEventListener("click", queryTask);
      loadCharacters();
    }

    window.addEventListener("load", initPage);
  </script>
</body>
</html>
