<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonora · 音频生成控制台</title>
<style>
:root{
  --bg:#f0f2f5;--panel:#ffffff;--sidebar:#ffffff;--topbar:#ffffff;
  --line:#e8ecf0;--line-2:#f1f3f6;
  --text:#1f2937;--text-2:#5f6b7a;--text-3:#9aa6b5;
  --primary:#1677ff;--primary-hover:#4096ff;--primary-soft:#e8f3ff;
  --success:#16a34a;--success-soft:#eaf7ee;
  --warn:#d97706;--warn-soft:#fff5e6;
  --danger:#dc2626;--danger-soft:#fdecec;
  --info:#0891b2;--info-soft:#e6f6fa;
  --debug:#6b7280;--debug-soft:#f1f3f5;
  --radius:8px;--radius-sm:5px;
  --shadow:0 1px 3px rgba(16,24,40,.06);--shadow-lg:0 12px 32px -12px rgba(16,24,40,.28);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary);text-decoration:none}
::selection{background:var(--primary-soft)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd6df;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#b8c1cd}
::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-columns:228px 1fr;height:100dvh}

.sidebar{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;height:60px;padding:0 20px;border-bottom:1px solid var(--line)}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:grid;place-items:center;flex:none}
.brand-mark svg{width:18px;height:18px;fill:#fff}
.brand-name{font-size:16px;font-weight:700;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--text-3);margin-top:-2px}
.nav{padding:14px 12px;overflow-y:auto;flex:1}
.nav-cap{font-size:11px;color:var(--text-3);padding:8px 10px 6px;letter-spacing:.06em}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-2);cursor:pointer;font-size:13.5px;position:relative;margin-bottom:3px;transition:background .15s,color .15s}
.nav-item:hover{background:var(--line-2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.nav-item svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3)}
.conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--debug);margin-right:6px;vertical-align:middle}
.conn-dot.on{background:var(--success)}
.conn-dot.off{background:var(--danger)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{height:60px;background:var(--topbar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex:none}
.crumb{font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:8px}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{color:#c7ced8}
.top-actions{display:flex;align-items:center;gap:10px}
.uid-wrap{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2)}
.uid-wrap input{width:64px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);text-align:center;font-size:13px;background:#fff}
.uid-wrap input:focus{outline:none;border-color:var(--primary)}

.content{padding:24px 26px 40px;overflow-y:auto;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:700;letter-spacing:.2px}
.page-desc{font-size:12.5px;color:var(--text-3);margin-top:3px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text-2);padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c8d0da;color:var(--text)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-label{font-size:12.5px;color:var(--text-2)}
.stat-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.stat-ico svg{width:16px;height:16px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stat-val{font-size:27px;font-weight:700;margin-top:10px;line-height:1.1}
.stat-foot{font-size:11.5px;color:var(--text-3);margin-top:6px}
.c-blue{background:var(--primary-soft);color:var(--primary)}
.c-green{background:var(--success-soft);color:var(--success)}
.c-orange{background:var(--warn-soft);color:var(--warn)}
.c-red{background:var(--danger-soft);color:var(--danger)}
.c-cyan{background:var(--info-soft);color:var(--info)}
.c-gray{background:var(--debug-soft);color:var(--debug)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line-2);gap:12px;flex-wrap:wrap}
.card-title{font-size:14.5px;font-weight:600}
.card-hint{font-size:11.5px;color:var(--text-3);font-weight:400;margin-left:8px}
.card-b{padding:18px 20px}

.distrib{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2);gap:2px}
.distrib span{display:block;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.legend em{font-style:normal;color:var(--text-2);font-size:12px}
.legend b{color:var(--text);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#fafbfc;color:var(--text-2);font-weight:600;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
tbody td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfc}
.cell-id{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.cell-main{font-weight:600;color:var(--text)}
.cell-clip{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:4px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag.success{background:var(--success-soft);color:var(--success)}
.tag.failed{background:var(--danger-soft);color:var(--danger)}
.tag.pending{background:var(--warn-soft);color:var(--warn)}
.tag.processing{background:var(--info-soft);color:var(--info)}
.tag.debug{background:var(--debug-soft);color:var(--debug)}
.tag.type{background:#f1f5ff;color:#4353c7}
.link{color:var(--primary);cursor:pointer}
.link:hover{text-decoration:underline}
.row-act{display:flex;gap:8px;align-items:center}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input,.filters select,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 11px;background:#fff;font-size:13px}
.filters input:focus,.filters select:focus,.form input:focus,.form select:focus,.form textarea:focus{outline:none;border-color:var(--primary)}
.filters input[type=text]{width:220px}

.empty{padding:52px 20px;text-align:center;color:var(--text-3)}
.empty svg{width:38px;height:38px;stroke:#cbd3dd;fill:none;stroke-width:1.5;margin-bottom:12px}
.empty p{font-size:13px}
.skel{padding:14px 16px}
.skel-line{height:12px;background:linear-gradient(90deg,#eef1f5,#e4e9ef,#eef1f5);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:4px;margin:9px 0}
@keyframes sh{to{background-position:-200% 0}}
.err{padding:16px 20px;background:var(--danger-soft);color:var(--danger);border-radius:var(--radius-sm);font-size:13px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%}
.field textarea{min-height:120px;resize:vertical;line-height:1.6}
.field .hint{font-size:11px;color:var(--text-3);margin-top:5px}

.timeline{width:100%}
.tl-scale,.tl-row{display:grid;grid-template-columns:132px 1fr;align-items:center}
.tl-scale{margin-bottom:6px}
.tl-lane-label{padding-right:14px;text-align:right}
.tl-lane-label b{display:block;font-size:12.5px;font-weight:600}
.tl-lane-label span{font-size:10.5px;color:var(--text-3)}
.tl-ruler{position:relative;height:20px;border-bottom:1px solid var(--line);margin-right:2px}
.tl-ruler span{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--text-3);font-family:var(--mono)}
.tl-ruler span:first-child{transform:none}
.tl-ruler span:last-child{transform:translateX(-100%)}
.tl-row{margin-bottom:9px}
.tl-track{position:relative;height:46px;background:repeating-linear-gradient(90deg,#fafbfc 0,#fafbfc 1px,transparent 1px,transparent 25%);border:1px solid var(--line);border-radius:5px;margin-right:2px}
.tl-block{position:absolute;top:6px;bottom:6px;border-radius:4px;color:#fff;font-size:11px;line-height:34px;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 6px;cursor:default;min-width:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.tl-block:hover{filter:brightness(1.08);z-index:3;box-shadow:0 3px 10px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.35)}
.tl-none{position:absolute;inset:0;display:grid;place-items:center;color:#c2cad4;font-size:11.5px}
.tl-note{font-size:11.5px;color:var(--text-3);margin-top:12px;line-height:1.7}

.tooltip{position:fixed;z-index:100;max-width:360px;width:max-content;background:#1f2937;color:#f3f4f6;border-radius:7px;padding:12px 14px;box-shadow:var(--shadow-lg);font-size:12.5px;line-height:1.6;pointer-events:none;opacity:0;transition:opacity .12s;display:none}
.tooltip.show{display:block;opacity:1}
.tt-h{font-weight:700;font-size:13px;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.tt-h i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tt-kv{display:grid;grid-template-columns:66px 1fr;gap:3px 8px;margin-bottom:7px}
.tt-kv .k{color:#9ca3af}
.tt-kv .v{color:#f3f4f6;font-family:var(--mono);font-size:11.5px;word-break:break-all}
.tt-prompt{border-top:1px solid rgba(255,255,255,.14);padding-top:8px;margin-top:4px;color:#e5e7eb;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow:hidden}

.drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.34);z-index:50;display:none}
.drawer-mask.show{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,92vw);background:#fff;box-shadow:-8px 0 32px -12px rgba(0,0,0,.3);display:flex;flex-direction:column;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
.drawer-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-h b{font-size:15px}
.drawer-x{border:none;background:none;font-size:22px;color:var(--text-3);line-height:1}
.drawer-x:hover{color:var(--text)}
.drawer-b{padding:20px 22px;overflow-y:auto;flex:1}
.code-block{background:#f7f8fa;border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;font-family:var(--mono);font-size:11.5px;line-height:1.65;white-space:pre-wrap;word-break:break-all;color:#374151}

.toast{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-10px);background:#1f2937;color:#fff;padding:10px 18px;border-radius:7px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .2s;box-shadow:var(--shadow-lg)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#15803d}
.toast.bad{background:#b91c1c}

@media(max-width:1080px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .app{grid-template-columns:190px 1fr}
  .content{padding:20px}
}
@media(max-width:720px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .stats{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .tl-scale,.tl-row{grid-template-columns:82px 1fr}
  .topbar{padding:0 14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v6H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1zm16 0h-3v6h3a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1z"/></svg></div>
      <div><div class="brand-name">Sonora</div><div class="brand-sub">音频生成控制台</div></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-cap">工作台</div>
      <div class="nav-item" data-view="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>总览</div>
      <div class="nav-item" data-view="tasks"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>任务中心</div>
      <div class="nav-item" data-view="create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>下发任务</div>
      <div class="nav-cap">资源</div>
      <div class="nav-item" data-view="characters"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>角色库</div>
      <div class="nav-cap">系统</div>
      <div class="nav-item" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>连接设置</div>
    </nav>
    <div class="sidebar-foot"><span class="conn-dot" id="connDot"></span><span id="connText">未配置连接</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">工作台 <span class="sep">/</span> <b>总览</b></div>
      <div class="top-actions">
        <div class="uid-wrap">用户 ID <input type="number" id="uidInput" min="1" value="1"></div>
        <button class="btn sm" id="refreshBtn"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>刷新</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>
<div class="drawer-mask" id="drawerMask"><div class="drawer" id="drawer">
  <div class="drawer-h"><b id="drawerTitle">详情</b><button class="drawer-x" id="drawerX">&times;</button></div>
  <div class="drawer-b" id="drawerBody"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
var state={key:"",base:"",audioPath:"/data",view:"overview",userId:1,tasks:[],detail:null,detailTaskId:"",characters:[],charTotal:0,charPage:1};
var TYPE_META={
  ASMR_TEXT:{label:"文本拆解"},
  ASMR_BACKEND_MUSIC:{label:"背景音乐"},
  ASMR_BACKEND_SUBMUSIC:{label:"音乐片段"},
  ASMR_MUSIC_PERSON:{label:"人声片段"},
  ASMR_MUSIC_ENVIRONMENT:{label:"音效片段"}
};
var STATUS_META={
  success:{label:"成功",color:"#16a34a"},
  failed:{label:"失败",color:"#dc2626"},
  pending:{label:"待处理",color:"#d97706"},
  processing:{label:"处理中",color:"#0891b2"},
  debug:{label:"调试",color:"#6b7280"}
};
var LANES=[
  {key:"human_speech",label:"人声对白",tag:"轨 1 · 文本",type:"human_speech",color:"#2563eb"},
  {key:"non_verbal_human_sound",label:"非语言人声",tag:"轨 2 · 文本",type:"non_verbal_human_sound",color:"#0891b2"},
  {key:"action_generated_sound",label:"动作音",tag:"轨 3 · 文本",type:"action_generated_sound",color:"#ea580c"},
  {key:"environmental_sound",label:"环境音",tag:"轨 4 · 文本",type:"environmental_sound",color:"#16a34a"}
];
var TYPE_CN={human_speech:"人声对白",non_verbal_human_sound:"非语言人声",action_generated_sound:"动作音",environmental_sound:"环境音"};
var AUDIO_SUBDIR={ASMR_BACKEND_SUBMUSIC:"music",ASMR_MUSIC_PERSON:"text",ASMR_MUSIC_ENVIRONMENT:"text"};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function apiBase(){if(state.base)return state.base.replace(/\/$/,"");if(location.protocol==="file:")return "http://127.0.0.1:8002";return location.origin}
function audioBase(){var p=state.audioPath.replace(/^\/+|\/+$/g,"");return apiBase()+"/"+p}
function audioUrl(taskId,sub){
  var dir=AUDIO_SUBDIR[sub.type];
  return audioBase()+"/"+encodeURIComponent(taskId)+"/"+dir+"/"+encodeURIComponent(sub.subtask_id)+".mp3";
}
function p2(n){return String(n).padStart(2,"0")}
function fmtTime(v){if(!v)return "-";var d=new Date(v);if(isNaN(d))return String(v);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())}
function fmtSec(sec){sec=Math.round(sec);var m=Math.floor(sec/60);var s=sec%60;return m+":"+p2(s)}
function toast(msg,kind){var t=document.getElementById("toast");t.textContent=msg;t.className="toast show"+(kind?" "+kind:"");clearTimeout(t._t);t._t=setTimeout(function(){t.className="toast"},2400)}
function statusTag(s){var m=STATUS_META[s]||{label:s};return '<span class="tag '+esc(s)+'">'+esc(m.label)+"</span>"}
function typeTag(t){var m=TYPE_META[t]||{label:t};return '<span class="tag type">'+esc(m.label)+"</span>"}

async function api(path,opts){
  opts=opts||{};
  var headers={"X-API-Key":state.key};
  if(opts.body)headers["Content-Type"]="application/json";
  var res;
  try{
    res=await fetch(apiBase()+path,{method:opts.method||"GET",headers:headers,body:opts.body?JSON.stringify(opts.body):undefined});
  }catch(e){throw new Error("无法连接服务："+e.message)}
  var data;
  try{data=await res.json()}catch(e){data=null}

function parseResult(text){if(!text||typeof text!=="string")return null;try{return JSON.parse(text)}catch(e){return null}}
function buildTimeline(detail){
  var segments=[],textEnd=0,declared=0;
  (detail.subtasks||[]).forEach(function(sub){
    if(sub.info&&sub.info.duration_minutes)declared=Math.max(declared,sub.info.duration_minutes*60);
    var data=parseResult(sub.result&&sub.result.result_text);
    if(sub.type==="ASMR_TEXT"&&data&&Array.isArray(data.segments)){
      segments=data.segments;
      data.segments.forEach(function(s){textEnd=Math.max(textEnd,Number(s.end_time)||0)});
    }
  });
  return {segments:segments,total:Math.max(textEnd,declared,60)};
}
function laneBlocks(lane,tl){
  var segs=tl.segments.filter(function(s){return s.type===lane.type});
  if(!segs.length)return '<div class="tl-none">无此类文本片段</div>';
  return segs.map(function(s){
    var st=Number(s.start_time)||0,en=Number(s.end_time)||0;
    var left=st/tl.total*100,width=Math.max((en-st)/tl.total*100,0.6);
    var kv=[["时间",fmtSec(st)+" - "+fmtSec(en)],["时长",(en-st)+" 秒"]];
    if(s.polling_count!=null)kv.push(["轮询",String(s.polling_count)]);
    if(s.reference_id!=null)kv.push(["角色ID",s.reference_id]);
    var tip={h:(TYPE_CN[lane.type]||lane.type)+" · 文本轨",color:lane.color,kv:kv,p:s.type_prompt};
    return blockHtml(left,width,lane.color,(en-st)+"s",tip);
  }).join("");
}
function blockHtml(left,width,color,text,tip){
  return '<div class="tl-block" style="left:'+left.toFixed(3)+"%;width:"+width.toFixed(3)+"%;background:"+color+'" data-tip="'+esc(JSON.stringify(tip))+'">'+esc(text)+"</div>";
}
function timelineHtml(detail){
  var tl=buildTimeline(detail);
  var scale='<div class="tl-scale"><div></div><div class="tl-ruler">';
  for(var i=0;i<=4;i++){scale+='<span style="left:'+(i*25)+'%">'+fmtSec(tl.total*i/4)+"</span>"}
  scale+="</div></div>";
  var rows=LANES.map(function(lane){
    return '<div class="tl-row"><div class="tl-lane-label"><b>'+esc(lane.label)+"</b><span>"+esc(lane.tag)+"</span></div>"
      +'<div class="tl-track">'+laneBlocks(lane,tl)+"</div></div>";
  }).join("");
  return '<div class="timeline">'+scale+rows+'</div><div class="tl-note">四条轨道共享同一时间刻度，对应文本拆解出的四类声音（按片段起止时间定位）。将鼠标移到色块上可查看完整详情。</div>';
}

function moveTip(e){
  var tip=document.getElementById("tooltip");

  if(y+hh>window.innerHeight-10)y=e.clientY-hh-16;

}

    reference_ids:refs,
    theme:g("cTheme").value.trim(),
    duration_minutes:parseInt(g("cDur").value,10)||0,
    language:g("cLang").value,
    background_music:g("cBg").checked
  };
  if(!payload.title){toast("请填写作品标题","bad");return}
  if(!payload.theme){toast("请填写创作主题","bad");return}
  if(payload.duration_minutes<1){toast("时长无效","bad");return}
  var out=document.getElementById("cResult");out.textContent="下发中…";
  try{
    var d=await api("/api/audio/tasks",{method:"POST",body:payload});
    state.userId=userId;document.getElementById("uidInput").value=userId;localStorage.setItem("sonora_user_id",String(userId));
    state.tasks=[];
    toast("任务已下发","ok");
    openTask(d.task_id,userId);
  }catch(e){out.textContent="";toast(e.message,"bad")}
}

function renderCharacters(){
  var c=document.getElementById("content");
  c.innerHTML='<div class="page-head"><div><div class="page-title">角色库</div><div class="page-desc">管理 Fish Audio 音色角色</div></div><button class="btn primary" onclick="openCharForm()">插入角色</button></div>'
    +'<div class="card"><div class="card-h"><div class="filters"><input type="text" id="ck" placeholder="名称关键字"><input type="text" id="ct" placeholder="标签"><input type="text" id="cr" placeholder="角色 ID"><select id="cs"><option value="">全部状态</option><option value="created">created</option><option value="training">training</option><option value="trained">trained</option></select><button class="btn" onclick="loadChars(1)">查询</button></div></div><div class="card-b" style="padding:0" id="charBody">'+skeleton()+"</div></div>";
  ["ck","ct","cr","cs"].forEach(function(id){document.getElementById(id).addEventListener("keydown",function(e){if(e.key==="Enter")loadChars(1)})});
  loadChars(1);
}
async function loadChars(page){
  var body=document.getElementById("charBody");if(!body)return;
  state.charPage=page||1;
  body.innerHTML='<div class="card-b skel"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div>';
  var q="/api/audio/characters?user_id="+state.userId+"&page="+page+"&page_size=20";
  var kw=document.getElementById("ck").value.trim();if(kw)q+="&keyword="+encodeURIComponent(kw);
  var tag=document.getElementById("ct").value.trim();if(tag)q+="&tag="+encodeURIComponent(tag);
  var ref=document.getElementById("cr").value.trim();if(ref)q+="&reference_id="+encodeURIComponent(ref);
  var st=document.getElementById("cs").value;if(st)q+="&state="+encodeURIComponent(st);
  try{
    var d=await api(q);
    state.characters=d.items||[];state.charTotal=d.total||0;
    if(!state.characters.length){body.innerHTML=empty("没有匹配的角色");return}
    var h='<table><thead><tr><th>角色名称</th><th>角色 ID</th><th>状态</th><th>语言</th><th>标签</th><th>入库时间</th></tr></thead><tbody>';
    state.characters.forEach(function(x){
      h+="<tr><td class=\"cell-main\">"+esc(x.title)+"</td><td class=\"cell-id\">"+esc(x.reference_id)+"</td><td>"+esc(x.state)+"</td><td>"+esc((x.languages||[]).join(", "))+"</td><td class=\"cell-clip\">"+esc((x.tags||[]).slice(0,5).join(", "))+"</td><td class=\"cell-id\">"+esc(fmtTime(x.create_time))+"</td></tr>";
    });
    h+="</tbody></table>";
    h+='<div style="padding:14px 16px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line-2)"><span style="font-size:12.5px;color:var(--text-3)">共 '+state.charTotal+" 条</span>"
      +'<button class="btn sm" '+(page<=1?"disabled":"")+' onclick="loadChars('+(page-1)+')">上一页</button>'
      +'<span style="font-size:12.5px">第 '+page+" 页</span>"
      +'<button class="btn sm" '+(page*20>=state.charTotal?"disabled":"")+' onclick="loadChars('+(page+1)+')">下一页</button></div>';
    body.innerHTML=h;
  }catch(e){body.innerHTML='<div class="err">'+esc(e.message)+"</div>"}
}
function openCharForm(){
  openDrawer("插入角色",'<div class="form" style="grid-template-columns:1fr"><div class="field"><label>角色 ID (reference_id)</label><input id="fRef" placeholder="Fish Audio 音色模型 ID"><div class="hint">系统据此从 Fish Audio 拉取角色详情并入库</div></div></div>'
    +'<div style="margin-top:18px;text-align:right"><button class="btn primary" onclick="submitChar()">插入</button></div>');
}
async function submitChar(){
  var el=document.getElementById("fRef");var ref=el?el.value.trim():"";
  if(!ref){toast("请填写角色 ID","bad");return}
  try{
    var d=await api("/api/audio/characters",{method:"POST",body:{reference_id:ref,user_id:state.userId}});
    toast(d.created?"角色已插入":"角色已存在，已更新","ok");
    closeDrawer();loadChars(1);
  }catch(e){toast(e.message,"bad")}
}

function renderSettings(){
  var c=document.getElementById("content");
  var env=state.base||(location.protocol==="file:"?"http://127.0.0.1:8002":location.origin);
  c.innerHTML='<div class="page-head"><div><div class="page-title">连接设置</div><div class="page-desc">配置后端地址与 API Key（保存在当前浏览器本地）</div></div></div>'
    +'<div class="card" style="max-width:680px"><div class="card-h"><span class="card-title">后端连接</span></div><div class="card-b">'
    +'<div class="form" style="grid-template-columns:1fr">'
    +'<div class="field"><label>API 地址</label><input id="setBase" value="'+esc(env)+'" placeholder="http://127.0.0.1:8002"><div class="hint">服务根地址，不含 /api 后缀。留空则使用当前站点地址</div></div>'
    +'<div class="field"><label>API Key</label><input id="setKey" type="password" value="'+esc(state.key)+'" placeholder="填写 BACKEND_API_KEY"><div class="hint">对应后端 .env 中的 BACKEND_API_KEY，通过 X-API-Key 请求头发送</div></div>'
    +'<div class="field"><label>音频相对路径</label><input id="setAudio" value="'+esc(state.audioPath)+'" placeholder="/data"><div class="hint">后端挂载音频目录的相对路径，对应 .env 中的 AUDIO_URL_PATH</div></div>'
    +'</div><div style="margin-top:18px;display:flex;gap:10px"><button class="btn primary" onclick="saveSettings()">保存</button><button class="btn" onclick="testConn()">验证连接</button></div>'
    +'<div id="setResult" style="margin-top:14px"></div>'
    +'</div></div>';
}
function saveSettings(){
  var base=document.getElementById("setBase").value.trim();
  var key=document.getElementById("setKey").value.trim();
  var audio=document.getElementById("setAudio").value.trim()||"/data";
  if(base&&base===location.origin)base="";
  state.base=base;state.key=key;state.audioPath=audio;
  localStorage.setItem("sonora_api_base",base);
  localStorage.setItem("sonora_api_key",key);
  localStorage.setItem("sonora_audio_path",audio);
  updateConn();
  toast("已保存","ok");
}
async function testConn(){
  var base=document.getElementById("setBase").value.trim();
  var key=document.getElementById("setKey").value.trim();
  if(base&&base===location.origin)base="";
  var oldBase=state.base,oldKey=state.key;
  state.base=base;state.key=key;
  var box=document.getElementById("setResult");
  box.innerHTML='<div style="font-size:12.5px;color:var(--text-3)">正在验证…</div>';
  try{
    var d=await api("/api/audio/tasks");
    box.innerHTML='<div class="err" style="background:var(--success-soft);color:var(--success)">连接成功，共 '+esc(d.total)+" 个任务</div>";
  }catch(e){
    state.base=oldBase;state.key=oldKey;
    box.innerHTML='<div class="err">'+esc(e.message)+"</div>";
  }
}

document.getElementById("nav").addEventListener("click",function(e){
  var item=e.target.closest(".nav-item");if(!item)return;
  go(item.dataset.view);
});
document.getElementById("uidInput").addEventListener("change",function(){
  var v=parseInt(this.value,10)||1;state.userId=v;localStorage.setItem("sonora_user_id",String(v));toast("用户 ID 已切换为 "+v,"ok");
});
document.getElementById("refreshBtn").addEventListener("click",function(){
  state.tasks=[];state.detail=null;
  route();toast("已刷新","ok");
});
document.getElementById("drawerX").addEventListener("click",closeDrawer);
document.getElementById("drawerMask").addEventListener("click",function(e){if(e.target===this)closeDrawer()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeDrawer();hideTip()}});
window.addEventListener("scroll",hideTip,true);

boot();
</script>
</body>
</html>
