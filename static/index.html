<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色库</title>
<style>
:root{color-scheme:dark;--bg:#111418;--card:#1b2027;--line:#2c333d;--text:#e8ecf1;--dim:#8b95a3;--accent:#4c9be8}
*{box-sizing:border-box}
body{margin:0;padding:32px;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 24px;font-size:13px}
.bar{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:20px}
.bar label{color:var(--dim);white-space:nowrap}
.bar input{flex:1}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px}
.card h2{font-size:15px;font-weight:600;margin:0 0 14px}
.field{margin-bottom:10px}
.field label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
input{width:100%;background:#12161c;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:7px 10px;font:inherit;outline:none}
input:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{background:var(--accent);border:0;border-radius:5px;color:#fff;padding:8px 18px;font:inherit;cursor:pointer;margin-top:6px}
button:disabled{opacity:.55;cursor:progress}
.out{margin-top:14px;background:#12161c;border:1px solid var(--line);border-radius:5px;padding:12px;min-height:60px;max-height:520px;overflow:auto;white-space:pre-wrap;word-break:break-all;font:12px/1.6 Consolas,Monaco,monospace;color:#c9d4df}
.status{margin-top:10px;font-size:12px;color:var(--dim)}
.status.ok{color:#63c08d}
.status.err{color:#e8776f}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500}
td.title{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;background:#252d38;border-radius:3px;padding:0 5px;margin-right:4px;color:var(--dim)}
@media(max-width:860px){.grid{grid-template-columns:1fr}body{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<h1>角色库</h1>
<p class="sub">插入：按 ID 从 Fish Audio 拉取并入库　·　查询：只读本地库</p>

<div class="bar">
<label for="apiKey">X-API-Key</label>
<input id="apiKey" placeholder="与 .env 的 BACKEND_API_KEY 一致">
</div>

<div class="grid">
<div>
<div class="card">
<h2>插入角色</h2>
<div class="field"><label>user_id</label><input id="insUserId" type="number" value="1"></div>
<div class="field"><label>reference_id</label><input id="insRefId" placeholder="Fish Audio 模型 ID"></div>
<button id="insBtn">插入</button>
<div id="insStatus" class="status"></div>
</div>
<div class="card" style="margin-top:20px">
<h2>响应</h2>
<div id="insOut" class="out">—</div>
</div>
</div>

<div>
<div class="card">
<h2>查询角色</h2>
<div class="row">
<div class="field"><label>user_id</label><input id="qryUserId" type="number" value="1"></div>
<div class="field"><label>page</label><input id="qryPage" type="number" value="1"></div>
</div>
<div class="row">
<div class="field"><label>page_size</label><input id="qryPageSize" type="number" value="10"></div>
<div class="field"><label>reference_id</label><input id="qryRefId" placeholder="精确匹配"></div>
</div>
<div class="row">
<div class="field"><label>keyword</label><input id="qryKeyword" placeholder="名称模糊"></div>
<div class="field"><label>tag</label><input id="qryTag" placeholder="标签精确"></div>
</div>
<div class="field"><label>state</label><input id="qryState" placeholder="状态精确"></div>
<button id="qryBtn">查询</button>
<div id="qryStatus" class="status"></div>
<div id="qryTable"></div>
</div>
<div class="card" style="margin-top:20px">
<h2>响应</h2>
<div id="qryOut" class="out">—</div>
</div>
</div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

const savedKey = localStorage.getItem('audio_api_key');
if (savedKey !== null) $('apiKey').value = savedKey;
$('apiKey').addEventListener('change', e => localStorage.setItem('audio_api_key', e.target.value.trim()));

function headers() {
  return {'X-API-Key': $('apiKey').value.trim(), 'Content-Type': 'application/json'};
}

async function request(url, options, statusId, outId) {
  const status = $(statusId), out = $(outId);
  status.className = 'status';
  status.textContent = '请求中…';
  out.textContent = '—';
  try {
    const res = await fetch(url, options);
    const data = await res.json();
    out.textContent = JSON.stringify(data, null, 2);
    status.className = res.ok ? 'status ok' : 'status err';
    status.textContent = `HTTP ${res.status}${res.ok ? ' · 成功' : ' · 失败'}`;
    return res.ok ? data : null;
  } catch (e) {
    status.className = 'status err';
    status.textContent = `请求异常：${e.message}`;
    out.textContent = '—';
    return null;
  }
}

$('insBtn').addEventListener('click', async e => {
  const btn = e.currentTarget;
  btn.disabled = true;
  await request('/api/audio/characters', {
    method: 'POST',
    headers: headers(),
    body: JSON.stringify({
      user_id: Number($('insUserId').value),
      reference_id: $('insRefId').value.trim()
    })
  }, 'insStatus', 'insOut');
  btn.disabled = false;
});

$('qryBtn').addEventListener('click', async e => {
  const btn = e.currentTarget;
  const params = new URLSearchParams({user_id: $('qryUserId').value, page: $('qryPage').value, page_size: $('qryPageSize').value});
  const extra = {
    reference_id: $('qryRefId').value,
    keyword: $('qryKeyword').value,
    tag: $('qryTag').value,
    state: $('qryState').value
  };
  for (const [k, v] of Object.entries(extra)) if (v.trim()) params.set(k, v.trim());

  btn.disabled = true;
  const data = await request(`/api/audio/characters?${params}`, {headers: headers()}, 'qryStatus', 'qryOut');
  if (data !== null) renderTable(data);
  btn.disabled = false;
});

function renderTable(data) {
  const box = $('qryTable');
  if (!data.items.length) { box.innerHTML = ''; return; }
  const rows = data.items.map(c => `<tr>
<td>${esc(c.reference_id)}</td>
<td class="title" title="${esc(c.title)}">${esc(c.title)}</td>
<td>${esc(c.type)} / ${esc(c.state)}</td>
<td>${c.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</td>
<td>${esc(String(c.update_time).replace('T', ' ').slice(0, 19))}</td>
</tr>`).join('');
  box.innerHTML = `<div class="status">共 ${data.total} 条，当前 ${data.items.length} 条</div>
<table><thead><tr><th>reference_id</th><th>名称</th><th>类型 / 状态</th><th>标签</th><th>更新时间</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}
</script>
</body>
</html>
