<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务下发</title>
<style>
:root{color-scheme:dark;--bg:#111418;--card:#1b2027;--line:#2c333d;--text:#e8ecf1;--dim:#8b95a3;--accent:#4c9be8}
*{box-sizing:border-box}
body{margin:0;padding:32px;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:920px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 24px;font-size:13px}
.bar{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:20px}
.bar label{color:var(--dim);white-space:nowrap}
.bar input{flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:20px}
.card h2{font-size:15px;font-weight:600;margin:0 0 14px}
.field{margin-bottom:10px}
.field label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
input,select{width:100%;background:#12161c;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:7px 10px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
.role{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.role input{width:auto}
.role code{color:var(--dim);font-size:11px;margin-left:auto}
button{background:var(--accent);border:0;border-radius:5px;color:#fff;padding:8px 18px;font:inherit;cursor:pointer;margin-top:6px}
button:disabled{opacity:.55;cursor:progress}
.out{background:#12161c;border:1px solid var(--line);border-radius:5px;padding:12px;min-height:60px;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-all;font:12px/1.6 Consolas,Monaco,monospace;color:#c9d4df}
.status{margin-top:10px;font-size:12px;color:var(--dim)}
.status.ok{color:#63c08d}
.status.err{color:#e8776f}
.badge{display:inline-block;border-radius:3px;padding:1px 7px;font-size:12px;background:#3a3320;color:#e0bd63}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500}
@media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<h1>任务下发</h1>
<p class="sub">下发后自动查一次，确认任务处于 pending　·　<a href="/" style="color:var(--accent)">角色库</a></p>
<p class="sub" id="originTip"></p>

<div class="bar">
<label for="apiKey">X-API-Key</label>
<input id="apiKey" placeholder="与 .env 的 BACKEND_API_KEY 一致">
</div>

<div class="grid">
<div>
<div class="card">
<h2>下发任务</h2>
<div class="field"><label>user_id</label><input id="userId" type="number" value="1"></div>
<div class="field"><label>title</label><input id="title" value="海边的约定"></div>
<div class="field"><label>参与角色（点「加载角色」从角色库选取）</label>
<button id="loadRolesBtn" style="margin:0 0 8px">加载角色</button>
<div id="roleList" class="status">先加载，再勾选要参与的角色</div>
</div>
<div class="field"><label>theme</label><input id="theme" value="黄昏的海边，两人并肩行走"></div>
<div class="row">
<div class="field"><label>duration_minutes</label><input id="duration" type="number" value="30"></div>
<div class="field"><label>language</label><select id="language"><option>zh</option><option>ja</option><option>en</option><option>ko</option></select></div>
</div>
<div class="field chk"><input id="bgm" type="checkbox" checked><label for="bgm">background_music（开则额外下发一条 ASMR_BACKEND_MUSIC）</label></div>
<button id="createBtn">下发并查询</button>
<div id="createStatus" class="status"></div>
</div>
</div>

<div>
<div class="card">
<h2>查询任务</h2>
<div class="row">
<div class="field"><label>task_id</label><input id="queryTaskId" placeholder="下发后自动填入"></div>
<div class="field"><label>user_id</label><input id="queryUserId" type="number" value="1"></div>
</div>
<button id="queryBtn">查询</button>
<div id="queryStatus" class="status"></div>
<div id="queryTable"></div>
</div>
<div class="card">
<h2>查询响应</h2>
<div id="queryOut" class="out">—</div>
</div>
</div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8002' : '';
if (location.protocol === 'file:') {
  $('originTip').innerHTML = '当前是本地文件方式打开，浏览器会拦截接口请求。请改用服务地址：<a href="http://127.0.0.1:8002/task.html" style="color:var(--accent)">http://127.0.0.1:8002/task.html</a>';
} else {
  $('originTip').textContent = `页面来源 ${location.origin}`;
}
const savedKey = localStorage.getItem('audio_api_key');
if (savedKey !== null) $('apiKey').value = savedKey;
$('apiKey').addEventListener('change', e => localStorage.setItem('audio_api_key', e.target.value.trim()));

function headers() {
  return {'X-API-Key': $('apiKey').value.trim(), 'Content-Type': 'application/json'};
}

async function call(url, options) {
  const res = await fetch(url, options);
  const data = await res.json();
  return {ok: res.ok, status: res.status, data};
}

$('loadRolesBtn').addEventListener('click', async e => {
  const btn = e.currentTarget;
  const box = $('roleList');
  btn.disabled = true;
  box.className = 'status';
  box.textContent = '加载中…';
  const params = new URLSearchParams({user_id: $('userId').value, page: '1', page_size: '50'});
  try {
    const r = await call(`${API_BASE}/api/audio/characters?${params}`, {headers: headers()});
    if (!r.ok) {
      box.className = 'status err';
      box.textContent = `加载失败 HTTP ${r.status}：${r.data.detail || ''}`;
    } else if (!r.data.items.length) {
      box.className = 'status';
      box.textContent = '该用户还没有角色，请先在角色库插入';
    } else {
      box.className = '';
      box.innerHTML = r.data.items.map(c => `<label class="role"><input type="checkbox" class="roleChk" value="${esc(c.reference_id)}"><span>${esc(c.title)}</span><code>${esc(c.reference_id)}</code></label>`).join('');
    }
  } catch (err) {
    box.className = 'status err';
    box.textContent = `请求异常：${err.message}`;
  } finally {
    btn.disabled = false;
  }
});

$('createBtn').addEventListener('click', async e => {
  const btn = e.currentTarget;
  const status = $('createStatus');
  btn.disabled = true;
  status.className = 'status';
  status.textContent = '下发中…';
  const referenceIds = Array.from(document.querySelectorAll('.roleChk:checked')).map(el => el.value);
  if (!referenceIds.length) {
    status.className = 'status err';
    status.textContent = '请先加载并勾选至少一个参与角色';
    btn.disabled = false;
    return;
  }
  const body = {
    user_id: Number($('userId').value),
    type: 'ASMR_TEXT',
    title: $('title').value.trim(),
    reference_ids: referenceIds,
    theme: $('theme').value.trim(),
    duration_minutes: Number($('duration').value),
    language: $('language').value,
    background_music: $('bgm').checked
  };
  try {
    const r = await call(`${API_BASE}/api/audio/tasks`, {method: 'POST', headers: headers(), body: JSON.stringify(body)});
    if (!r.ok) {
      status.className = 'status err';
      status.textContent = `下发失败 HTTP ${r.status}：${r.data.detail || ''}`;
    } else {
      status.className = 'status ok';
      status.textContent = `下发成功，task_id=${r.data.task_id}，状态=${r.data.status}，正在查询…`;
      $('queryTaskId').value = r.data.task_id;
      $('queryUserId').value = $('userId').value;
      await doQuery();
    }
  } catch (err) {
    status.className = 'status err';
    status.textContent = `请求异常：${err.message}`;
  } finally {
    btn.disabled = false;
  }
});

$('queryBtn').addEventListener('click', doQuery);

async function doQuery() {
  const btn = $('queryBtn');
  const status = $('queryStatus');
  const taskId = $('queryTaskId').value.trim();
  if (!taskId) {
    status.className = 'status err';
    status.textContent = '请填 task_id';
    return;
  }
  btn.disabled = true;
  status.className = 'status';
  status.textContent = '查询中…';
  const params = new URLSearchParams({user_id: $('queryUserId').value});
  try {
    const r = await call(`${API_BASE}/api/audio/tasks/${encodeURIComponent(taskId)}?${params}`, {headers: headers()});
    $('queryOut').textContent = JSON.stringify(r.data, null, 2);
    status.className = r.ok ? 'status ok' : 'status err';
    status.textContent = r.ok ? `HTTP 200 · 任务状态 ${r.data.status}` : `查询失败 HTTP ${r.status}`;
    renderTable(r.ok ? r.data : null);
  } catch (err) {
    status.className = 'status err';
    status.textContent = `请求异常：${err.message}`;
    $('queryOut').textContent = '—';
    renderTable(null);
  } finally {
    btn.disabled = false;
  }
}

function renderTable(data) {
  const box = $('queryTable');
  if (!data || !data.subtasks.length) { box.innerHTML = ''; return; }
  const rows = data.subtasks.map(s => `<tr>
<td>${esc(s.subtask_id)}</td>
<td>${esc(s.type)}</td>
<td><span class="badge">${esc(s.status)}</span></td>
<td>${esc(s.info.title)}</td>
<td>${esc(s.result.result_text) || '—'}</td>
</tr>`).join('');
  box.innerHTML = `<table><thead><tr><th>subtask_id</th><th>type</th><th>status</th><th>title</th><th>result</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}
</script>
</body>
</html>
