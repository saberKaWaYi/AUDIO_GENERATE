<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="login.title">登录 - AI AUDIO</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/i18n.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div id="langSwitcher" class="lang-switcher"></div>
      <h1>AI AUDIO</h1>
      <p class="sub" data-i18n="login.subtitle">请选择登录方式</p>
      <div id="googleBtn"></div>
      <div id="emailSection" class="email-section" hidden>
        <div class="divider"><span data-i18n="login.orEmail">或使用邮箱登录</span></div>
        <input id="emailInput" type="email" data-i18n-placeholder="login.emailPlaceholder" placeholder="邮箱地址" autocomplete="email">
        <div class="code-row">
          <input id="codeInput" type="text" data-i18n-placeholder="login.codePlaceholder" placeholder="验证码" inputmode="numeric" maxlength="6">
          <button id="sendCodeBtn" type="button" data-i18n="login.sendCode">发送验证码</button>
        </div>
        <button id="emailLoginBtn" class="primary-btn" type="button" data-i18n="login.emailLogin">邮箱登录</button>
      </div>
      <p class="msg" id="msg"></p>
    </div>
  </div>

  <script>
    const msg = document.getElementById("msg");
    const emailSection = document.getElementById("emailSection");
    const emailInput = document.getElementById("emailInput");
    const codeInput = document.getElementById("codeInput");
    const sendCodeBtn = document.getElementById("sendCodeBtn");
    const emailLoginBtn = document.getElementById("emailLoginBtn");
    let lastGmailMatch = false;

    function showMessage(text) {
      msg.textContent = text;
    }

    let countdownTimer = null;

    function resendLabel(left) {
      return I18n.t("login.resendIn", { n: left });
    }

    function startSendCountdown() {
      let left = 60;
      sendCodeBtn.textContent = resendLabel(left);
      countdownTimer = setInterval(() => {
        left -= 1;
        if (left <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          sendCodeBtn.disabled = false;
          sendCodeBtn.textContent = I18n.t("login.sendCode");
          return;
        }
        sendCodeBtn.textContent = resendLabel(left);
      }, 1000);
    }

    function isGmailAddress(email) {
      return email.toLowerCase().endsWith("@gmail.com");
    }

    function highlightGoogleButton() {
      const btn = document.getElementById("googleBtn");
      btn.scrollIntoView({ behavior: "smooth", block: "center" });
      btn.style.outline = "3px solid #2563eb";
      btn.style.outlineOffset = "6px";
      btn.style.borderRadius = "8px";
    }

    function redirectToGoogle() {
      const container = document.getElementById("googleBtn");
      const gButton = container.querySelector("[role='button']");
      if (!gButton) {
        showMessage(I18n.t("login.gmailUseGoogle"));
        highlightGoogleButton();
        return;
      }
      showMessage(I18n.t("login.openingGoogle"));
      gButton.click();
    }

    function handleEmailInput() {
      const isGmail = isGmailAddress(emailInput.value.trim());
      if (isGmail && !lastGmailMatch) {
        lastGmailMatch = true;
        redirectToGoogle();
      } else if (!isGmail) {
        lastGmailMatch = false;
      }
    }

    async function init() {
      try {
        const check = await fetch("/api/auth/me", { credentials: "same-origin" });
        if (check.ok) {
          window.location.replace("/index.html");
          return;
        }
      } catch (e) {
        showMessage(I18n.t("login.serviceUnavailable"));
        return;
      }

      let config;
      try {
        const res = await fetch("/api/auth/config", { credentials: "same-origin" });
        if (!res.ok) {
          showMessage(I18n.t("login.configFailed"));
          return;
        }
        config = await res.json();
      } catch (e) {
        showMessage(I18n.t("login.configFailed"));
        return;
      }

      if (config.email_enabled) {
        emailSection.hidden = false;
      }

      if (!config.google_client_id) {
        if (!config.email_enabled) {
          showMessage(I18n.t("login.noMethod"));
        }
      } else if (typeof google === "undefined" || !google.accounts) {
        showMessage(I18n.t("login.googleFailed"));
      } else {
        google.accounts.id.initialize({
          client_id: config.google_client_id,
          callback: handleCredential,
          locale: I18n.current,
        });
        google.accounts.id.renderButton(document.getElementById("googleBtn"), {
          theme: "outline",
          size: "large",
          width: 320,
          text: "signin_with",
          locale: I18n.current,
        });
      }
    }

    async function handleCredential(response) {
      showMessage(I18n.t("login.signingIn"));
      try {
        const res = await fetch("/api/auth/google", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: response.credential }),
        });
        if (res.ok) {
          window.location.replace("/index.html");
          return;
        }
        const data = await res.json();
        showMessage(data.detail || I18n.t("login.signInFailed"));
      } catch (e) {
        showMessage(I18n.t("login.requestFailed"));
      }
    }

    async function handleSendCode() {
      const email = emailInput.value.trim();
      if (!email) {
        showMessage(I18n.t("login.enterEmail"));
        return;
      }
      if (isGmailAddress(email)) {
        redirectToGoogle();
        return;
      }
      sendCodeBtn.disabled = true;
      let sent = false;
      try {
        const res = await fetch("/api/auth/email/send-code", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email }),
        });
        if (res.ok) {
          sent = true;
          showMessage(I18n.t("login.codeSent"));
          startSendCountdown();
        } else {
          const data = await res.json();
          showMessage(data.detail || I18n.t("login.sendFailed"));
        }
      } catch (e) {
        showMessage(I18n.t("login.sendRequestFailed"));
      } finally {
        if (!sent) {
          sendCodeBtn.disabled = false;
        }
      }
    }

    async function handleEmailLogin() {
      const email = emailInput.value.trim();
      const code = codeInput.value.trim();
      if (!email || !code) {
        showMessage(I18n.t("login.enterEmailAndCode"));
        return;
      }
      if (isGmailAddress(email)) {
        redirectToGoogle();
        return;
      }
      showMessage(I18n.t("login.signingIn"));
      try {
        const res = await fetch("/api/auth/email/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, code: code }),
        });
        if (res.ok) {
          window.location.replace("/index.html");
          return;
        }
        const data = await res.json();
        showMessage(data.detail || I18n.t("login.signInFailed"));
      } catch (e) {
        showMessage(I18n.t("login.requestFailed"));
      }
    }

    window.addEventListener("aiaudio:langchange", () => {
      if (countdownTimer !== null) {
        sendCodeBtn.textContent = resendLabel(Number(sendCodeBtn.textContent.replace(/\D/g, "")));
      }
      if (typeof google !== "undefined" && google.accounts && google.accounts.id) {
        google.accounts.id.renderButton(document.getElementById("googleBtn"), {
          theme: "outline",
          size: "large",
          width: 320,
          text: "signin_with",
          locale: I18n.current,
        });
      }
    });

    emailInput.addEventListener("input", handleEmailInput);
    sendCodeBtn.addEventListener("click", handleSendCode);
    emailLoginBtn.addEventListener("click", handleEmailLogin);

    window.addEventListener("load", () => {
      I18n.init();
      I18n.buildSwitcher(document.getElementById("langSwitcher"));
      init();
    });
  </script>
</body>
</html>
