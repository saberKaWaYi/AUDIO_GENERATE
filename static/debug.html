<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务调试台</title>
<style>
:root{color-scheme:dark;--bg:#111418;--card:#1b2027;--line:#2c333d;--text:#e8ecf1;--dim:#8b95a3;--accent:#4c9be8}
*{box-sizing:border-box}
body{margin:0;padding:32px;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{color:var(--dim);margin:0 0 24px;font-size:13px}
.bar{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:20px}
.bar label{color:var(--dim);white-space:nowrap}
.bar input{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:20px}
.card h2{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
input{background:#12161c;border:1px solid var(--line);border-radius:5px;color:var(--text);padding:7px 10px;font:inherit;outline:none}
input:focus{border-color:var(--accent)}
button{background:var(--accent);border:0;border-radius:5px;color:#fff;padding:7px 16px;font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:progress}
button.release{background:#2f7d5b}
button.release:hover{background:#369269}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500}
tr.task-row{cursor:pointer}
tr.task-row:hover{background:#20262e}
tr.task-row.active{background:#223047}
.badge{display:inline-block;border-radius:3px;padding:1px 7px;font-size:12px;white-space:nowrap}
.s-debug{background:#3a3320;color:#e0bd63}
.s-pending{background:#203245;color:#6fb2e8}
.s-processing{background:#2a2f3d;color:#a9b6c9}
.s-success{background:#1f3d2e;color:#63c08d}
.s-failed{background:#3d2020;color:#e8776f}
.status{margin-top:10px;font-size:12px;color:var(--dim)}
.status.ok{color:#63c08d}
.status.err{color:#e8776f}
.out{background:#12161c;border:1px solid var(--line);border-radius:5px;padding:12px;min-height:60px;max-height:360px;overflow:auto;white-space:pre-wrap;word-break:break-all;font:12px/1.6 Consolas,Monaco,monospace;color:#c9d4df}
code{font:12px/1.5 Consolas,Monaco,monospace;color:#b9c6d4}
@media(max-width:760px){body{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<h1>任务调试台</h1>
<p class="sub">列出所有任务 → 点一行看子任务详情 → debug 的子任务点「放行」变 pending　·　<a href="/task.html" style="color:var(--accent)">任务下发</a>　·　<a href="/" style="color:var(--accent)">角色库</a></p>
<p class="sub" id="originTip"></p>

<div class="bar">
<label for="apiKey">X-API-Key</label>
<input id="apiKey" placeholder="与 .env 的 BACKEND_API_KEY 一致">
</div>

<div class="card">
<h2>任务列表 <span><button id="refreshBtn" style="padding:5px 12px">刷新</button></span></h2>
<div id="listStatus" class="status"></div>
<div id="listTable"></div>
</div>

<div class="card">
<h2>子任务详情 <span id="detailTitle" style="font-size:12px;color:var(--dim);font-weight:400"></span></h2>
<div id="detailStatus" class="status"></div>
<div id="detailTable"></div>
</div>

<div class="card">
<h2>原始响应</h2>
<div id="rawOut" class="out">—</div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const API_BASE = location.protocol === 'file:' ? 'http://127.0.0.1:8002' : '';
if (location.protocol === 'file:') {
  $('originTip').innerHTML = '当前是本地文件方式打开，浏览器会拦截接口请求。请改用服务地址：<a href="http://127.0.0.1:8002/debug.html" style="color:var(--accent)">http://127.0.0.1:8002/debug.html</a>';
} else {
  $('originTip').textContent = `页面来源 ${location.origin}`;
}
const savedKey = localStorage.getItem('audio_api_key');
if (savedKey !== null) $('apiKey').value = savedKey;
$('apiKey').addEventListener('change', e => localStorage.setItem('audio_api_key', e.target.value.trim()));

function headers() {
  return {'X-API-Key': $('apiKey').value.trim()};
}

async function call(url, options) {
  const res = await fetch(url, options);
  let data;
  try { data = await res.json(); } catch (e) { data = res.statusText; }
  return {ok: res.ok, status: res.status, data};
}

function badge(status) {
  const cls = 's-' + String(status).toLowerCase();
  return `<span class="badge ${cls}">${esc(status)}</span>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}

let activeTaskId = null;

async function refreshList() {
  const status = $('listStatus');
  status.className = 'status';
  status.textContent = '加载中…';
  try {
    const r = await call(`${API_BASE}/api/audio/tasks`, {headers: headers()});
    if (!r.ok) {
      status.className = 'status err';
      status.textContent = `加载失败 HTTP ${r.status}：${(r.data && r.data.detail) || ''}`;
      $('listTable').innerHTML = '';
      return;
    }
    status.className = 'status';
    status.textContent = `共 ${r.data.total} 个任务`;
    const rows = r.data.items.map(t => `<tr class="task-row ${t.task_id === activeTaskId ? 'active' : ''}" data-task="${esc(t.task_id)}" data-user="${t.user_id}">
<td><code>${esc(t.task_id)}</code></td>
<td>${t.user_id}</td>
<td>${badge(t.status)}</td>
<td>${t.subtask_count}</td>
<td>${esc(t.create_time)}</td>
<td>${esc(t.update_time)}</td>
</tr>`).join('');
    $('listTable').innerHTML = r.data.items.length
      ? `<table><thead><tr><th>task_id</th><th>user_id</th><th>状态</th><th>子任务数</th><th>create_time</th><th>update_time</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="status">暂无任务</div>';
    document.querySelectorAll('.task-row').forEach(tr => {
      tr.addEventListener('click', () => showDetail(tr.dataset.task, tr.dataset.user));
    });
  } catch (err) {
    status.className = 'status err';
    status.textContent = `请求异常：${err.message}`;
  }
}

let activeTaskUserId = null;

async function showDetail(taskId, userId) {
  activeTaskId = taskId;
  activeTaskUserId = userId;
  document.querySelectorAll('.task-row').forEach(tr => tr.classList.toggle('active', tr.dataset.task === taskId));
  $('detailTitle').textContent = taskId;
  const status = $('detailStatus');
  status.className = 'status';
  status.textContent = '加载中…';
  const params = new URLSearchParams({user_id: userId});
  try {
    const r = await call(`${API_BASE}/api/audio/tasks/${encodeURIComponent(taskId)}?${params}`, {headers: headers()});
    $('rawOut').textContent = JSON.stringify(r.data, null, 2);
    if (!r.ok) {
      status.className = 'status err';
      status.textContent = `加载失败 HTTP ${r.status}：${(r.data && r.data.detail) || ''}`;
      $('detailTable').innerHTML = '';
      return;
    }
    status.className = 'status';
    status.textContent = `共 ${r.data.subtasks.length} 条子任务`;
    renderDetail(r.data.subtasks);
  } catch (err) {
    status.className = 'status err';
    status.textContent = `请求异常：${err.message}`;
    $('rawOut').textContent = '—';
  }
}

function renderDetail(subtasks) {
  const rows = subtasks.map(s => {
    const releaseBtn = s.status === 'debug'
      ? `<button class="release" data-sub="${esc(s.subtask_id)}">放行</button>`
      : '—';
    const summary = s.type === 'ASMR_BACKEND_SUBMUSIC' ? s.info.prompt : s.info.title;
    return `<tr>
<td><code>${esc(s.subtask_id)}</code></td>
<td>${esc(s.type)}</td>
<td>${badge(s.status)}</td>
<td>${esc(summary)}</td>
<td><code>${esc(JSON.stringify(s.result))}</code></td>
<td>${releaseBtn}</td>
</tr>`;
  }).join('');
  $('detailTable').innerHTML = `<table><thead><tr><th>subtask_id</th><th>type</th><th>status</th><th>title/prompt</th><th>result</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.querySelectorAll('button.release').forEach(btn => {
    btn.addEventListener('click', () => releaseSubtask(btn.dataset.sub, btn));
  });
}

async function releaseSubtask(subtaskId, btn) {
  btn.disabled = true;
  const status = $('detailStatus');
  status.className = 'status';
  status.textContent = `放行 ${subtaskId} …`;
  try {
    const r = await call(`${API_BASE}/api/audio/tasks/${encodeURIComponent(subtaskId)}/release`, {method: 'POST', headers: headers()});
    if (!r.ok) {
      status.className = 'status err';
      status.textContent = `放行失败 HTTP ${r.status}：${(r.data && r.data.detail) || ''}`;
      btn.disabled = false;
      return;
    }
    status.className = 'status ok';
    status.textContent = `放行成功：${subtaskId} → ${r.data.status}`;
    await showDetail(activeTaskId, activeTaskUserId);
    await refreshList();
  } catch (err) {
    status.className = 'status err';
    status.textContent = `请求异常：${err.message}`;
    btn.disabled = false;
  }
}

$('refreshBtn').addEventListener('click', refreshList);
refreshList();
</script>
</body>
</html>
