services:
  web:
    build:
      context: .
      target: web
    command: python main.py web --host 0.0.0.0 --port 8002 --no-reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api.fish.audio:104.18.0.100"
    expose:
      - "8002"
    ports:
      - "8002:8002"
    environment:
      - DEBUG=${DEBUG:-false}
      - WEB_DEBUG=${WEB_DEBUG:-}
      - WEB_NAME=${WEB_NAME:-Audio Generate Web Service}
      - WEB_VERSION=${WEB_VERSION:-1.0}
      - BACKEND_API_KEY=${BACKEND_API_KEY:?Set BACKEND_API_KEY}
      - MONGODB_HOST=${MONGODB_HOST:?Set MONGODB_HOST to the MongoDB host used by AUDIO-GENERATE}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_USERNAME=${MONGODB_USERNAME:-mongodb}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:?Set MONGODB_PASSWORD}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-audio_generate}
      - FISH_AUDIO_BASE_URL=${FISH_AUDIO_BASE_URL:-https://api.fish.audio}
      - FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY:?Set FISH_AUDIO_API_KEY}
      - FISH_AUDIO_TIMEOUT=${FISH_AUDIO_TIMEOUT:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/docs', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    command: python main.py worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api.fish.audio:104.18.0.100"
    depends_on:
      web:
        condition: service_healthy
    environment:
      - DEBUG=${DEBUG:-false}
      - WORKER_DEBUG=${WORKER_DEBUG:-}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-5}
      - MUSIC_DATA_DIR=${MUSIC_DATA_DIR:-data}
      - MONGODB_HOST=${MONGODB_HOST:?Set MONGODB_HOST to the MongoDB host used by AUDIO-GENERATE}
      - MONGODB_PORT=${MONGODB_PORT:-27017}
      - MONGODB_USERNAME=${MONGODB_USERNAME:-mongodb}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:?Set MONGODB_PASSWORD}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-audio_generate}
      - FISH_AUDIO_BASE_URL=${FISH_AUDIO_BASE_URL:-https://api.fish.audio}
      - FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY:?Set FISH_AUDIO_API_KEY}
      - FISH_AUDIO_TIMEOUT=${FISH_AUDIO_TIMEOUT:-30}
      - ELEVENLABS_BASE_URL=${ELEVENLABS_BASE_URL:-https://api.elevenlabs.io}
      - ELEVENLABS_API_KEYS=${ELEVENLABS_API_KEYS:?Set ELEVENLABS_API_KEYS}
      - ELEVENLABS_MUSIC_MODEL_ID=${ELEVENLABS_MUSIC_MODEL_ID:-music_v2_5}
      - ELEVENLABS_SOUND_MODEL_ID=${ELEVENLABS_SOUND_MODEL_ID:-eleven_text_to_sound_v3}
      - ELEVENLABS_TIMEOUT=${ELEVENLABS_TIMEOUT:-600}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      - DEEPSEEK_TIMEOUT=${DEEPSEEK_TIMEOUT:-600}
      - DEEPSEEK_TEMPERATURE=${DEEPSEEK_TEMPERATURE:-0.7}
      - DEEPSEEK_MAX_TOKENS=${DEEPSEEK_MAX_TOKENS:-393216}
      - DEEPSEEK_MAX_RETRIES=${DEEPSEEK_MAX_RETRIES:-3}
    restart: unless-stopped
